services:
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: aboutme-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    command: pnpm dev
    networks:
      - aboutme


  postgres:
    image: postgres:18
    container_name: aboutme-postgres
    environment:
      POSTGRES_DB: aboutme
      POSTGRES_USER: aboutme
      POSTGRES_PASSWORD: aboutme
    volumes:
      - ./sqldata:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - aboutme

  minio:
    image: quay.io/minio/minio:latest
    container_name: aboutme-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - aboutme

networks:
  aboutme:
    driver: bridge