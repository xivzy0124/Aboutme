name: aboutme-dev

services:
  frontend:
    image: node:22-alpine
    container_name: aboutme-frontend
    working_dir: /app
    init: true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # 容器内监听宿主机文件变更需要轮询，否则改样式必须重启容器
      WATCHPACK_POLLING: "true"
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0 --port 3000"
    networks:
      - aboutme


  backend:
    image: python:3.12-slim
    container_name: aboutme-backend
    working_dir: /app
    init: true
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - aboutme

  postgres:
    image: postgres:18
    container_name: aboutme-postgres
    environment:
      POSTGRES_DB: aboutme
      POSTGRES_USER: aboutme
      POSTGRES_PASSWORD: aboutme
    volumes:
      - ./sqldata:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - aboutme

  minio:
    image: quay.io/minio/minio:latest
    container_name: aboutme-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - aboutme

volumes:
  frontend_node_modules:
  pnpm_store:

networks:
  aboutme:
    driver: bridge
